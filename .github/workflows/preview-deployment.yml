name: Production and PR preview deployment

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - main
      - release
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: moment-palette-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 品質検査とデプロイ
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: pnpmを準備してstoreを復元
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: commit固有のbuild metadataを生成
        run: pnpm metadata:ci

      - name: 型を検査
        run: pnpm typecheck

      - name: 単体テストを実行
        run: pnpm test:run

      - name: lintを実行
        run: pnpm lint

      - name: formatを検査
        run: pnpm format:check

      - name: production buildを生成
        run: pnpm build:prepared

      - name: Node.js 22をAPI用に準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: API依存関係を凍結install
        run: npm --prefix api ci

      - name: APIの型を検査
        run: npm --prefix api run typecheck

      - name: APIの単体テストを実行
        run: npm --prefix api test

      - name: APIをbuild
        run: npm --prefix api run build

      - name: build metadataの三者一致を検査
        run: pnpm metadata:verify

      - name: build成果物の秘密値を検査
        run: pnpm security:artifacts

      # 外部forkとDependabot PRにはrepository secretを渡さず、品質検査だけを行う。
      - name: 生成済み成果物をSWAへデプロイ
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 (2026-09-21確認)
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCTION }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          api_build_command: npm run build
          output_location: ''
          skip_app_build: true
          production_branch: release

  close-preview:
    name: PRプレビューを終了
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: SWAのPRプレビューを閉じる
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 (2026-09-21確認)
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCTION }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close
